server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy the API under /api. Re-resolve the name so an API restart does not leave a stale address.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        # add_header is not inherited once a location sets its own, so repeat the security headers here.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
