data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
train:
  seed: 42
  test_size: 0.2
  n_trials: 20
  cv_folds: 5
  models: [dummy, logreg, rf, xgb]
  sensitive_tolerance: 0.005  # drop gender/SeniorCitizen if it costs at most this much CV PR-AUC
gate:
  min_pr_auc: 0.50
  baseline_margin: 0.0        # must not be worse than the logistic-regression baseline (0.02 rejected everything, see docs)
  champion_tolerance: 0.005   # may be at most this much worse than the current champion
economics:                    # assumptions, see docs/open-questions.md Q1-Q2
  value_months: 12
  retention_cost_rate: 0.10
  retention_success: 0.30
  k_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
