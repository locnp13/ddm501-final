name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: pip install -r requirements-train.txt ruff==0.12.0 pytest-cov
      - run: ruff check src tests
      - run: pytest --cov=src --cov-report=term-missing
      - name: Validate monitoring configuration and manifests
        run: |
          prom="docker run --rm --entrypoint promtool -v $PWD/k8s/monitoring/prometheus:/etc/prometheus -w /etc/prometheus prom/prometheus:v2.55.1"
          $prom check config /etc/prometheus/prometheus.yml
          $prom test rules alerts_test.yml
          docker run --rm --entrypoint amtool -v "$PWD/k8s/monitoring/alertmanager:/cfg" prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml
          for f in k8s/monitoring/grafana/dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
          for dir in k8s/base k8s/monitoring k8s/canary; do kubectl kustomize "$dir" > /dev/null; done

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api, context: ., file: deploy/Dockerfile.api}
          - {name: frontend, context: frontend, file: frontend/Dockerfile}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }} image (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
