name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: pip install -r requirements-train.txt ruff==0.12.0 pytest-cov
      - run: ruff check src tests
      - run: pytest --cov=src --cov-report=term-missing

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api, context: ., file: deploy/Dockerfile.api}
          - {name: frontend, context: frontend, file: frontend/Dockerfile}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }} image (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Runs on the maintainer's Mac (runner label churn-local) and updates the local minikube cluster.
  # Only on a push to main: pull requests, including ones from forks, must never reach this runner.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, churn-local]
    concurrency:
      group: deploy-local
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build for arm64 and roll out to minikube
        run: scripts/deploy-local.sh "${{ github.sha }}"
