groups:
  - name: churn-api
    rules:
      - alert: ApiDown
        expr: up{job="churn-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Churn API is unreachable"}

      - alert: ModelNotLoaded
        expr: churn_model_loaded == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "API is running without a model"}

      - alert: HighErrorRate
        expr: |
          sum(rate(churn_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(churn_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of prediction requests fail"}

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(churn_request_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 prediction latency above 500 ms"}
