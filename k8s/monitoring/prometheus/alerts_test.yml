# Run with: promtool test rules alerts_test.yml   (CI does this)
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  - name: 10% server errors fire HighErrorRate
    interval: 1m
    input_series:
      - series: 'churn_requests_total{endpoint="predict",status="200",model_version="3",pod="a"}'
        values: '0+90x30'
      - series: 'churn_requests_total{endpoint="predict",status="500",model_version="3",pod="a"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "More than 5% of prediction requests fail"
              description: "Server errors (5xx) are above 5% of requests over 5 minutes."

  - name: 1% server errors stay quiet
    interval: 1m
    input_series:
      - series: 'churn_requests_total{endpoint="predict",status="200",model_version="3",pod="a"}'
        values: '0+99x30'
      - series: 'churn_requests_total{endpoint="predict",status="500",model_version="3",pod="a"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HighErrorRate
        exp_alerts: []

  - name: 30% rejected requests fire HighValidationErrorRate, a quiet API does not
    interval: 1m
    input_series:
      - series: 'churn_requests_total{endpoint="predict",status="200",model_version="3",pod="a"}'
        values: '0+70x30'
      - series: 'churn_requests_total{endpoint="predict",status="422",model_version="3",pod="a"}'
        values: '0+30x30'
      - series: 'churn_requests_total{endpoint="predict",status="200",model_version="3",pod="quiet"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighValidationErrorRate
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "More than 20% of requests are rejected as invalid"
              description: "Clients keep sending data the API rejects (422); check the caller or a schema change."

  - name: a pod that stops answering scrapes fires ApiDown with its name
    interval: 1m
    input_series:
      - series: 'up{job="churn-api",pod="api-1",track="stable"}'
        values: '1x5 0x10'
      - series: 'up{job="churn-api",pod="api-2",track="stable"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiDown
        exp_alerts:
          - exp_labels: {severity: critical, job: churn-api, pod: api-1, track: stable}
            exp_annotations:
              summary: "API pod api-1 is unreachable"
              description: "Prometheus cannot scrape api-1 (track stable)."
      - eval_time: 12m
        alertname: ReplicaLost
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Fewer than 2 stable API pods are up"
              description: "The stable API runs with 2 replicas; one is missing, so there is no spare capacity."

  - name: no API target at all fires ApiNoTargets
    interval: 1m
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiNoTargets
        exp_alerts:
          - exp_labels: {severity: critical, job: churn-api}  # absent() copies the matcher into the labels
            exp_annotations:
              summary: "Prometheus sees no API pod"
              description: "No target for job churn-api for 2 minutes: the pods are gone or discovery is broken."

  - name: a mean probability of 0.5 fires PredictionDrift, 0.27 does not
    interval: 1m
    input_series:
      # 60 predictions per minute; the sum grows by 30 (mean 0.5) or 16.2 (mean 0.27) per minute
      - series: 'churn_probability_count{model_version="3"}'
        values: '0+60x120'
      - series: 'churn_probability_sum{model_version="3"}'
        values: '0+30x120'
      - series: 'churn_probability_count{model_version="4"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: PredictionDrift
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Average predicted churn probability drifted from the training rate"
              description: "The 1h mean probability is more than 0.10 away from 0.27 (about 50 predictions or more): the population may have changed."

  - name: a population matching the training rate does not drift
    interval: 1m
    input_series:
      - series: 'churn_probability_count{model_version="3"}'
        values: '0+60x120'
      - series: 'churn_probability_sum{model_version="3"}'
        values: '0+16.2x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: PredictionDrift
        exp_alerts: []

  - name: unseen categories in 10% of predictions fire UnknownCategorySpike
    interval: 1m
    input_series:
      - series: 'churn_predictions_total{label="stay",model_version="3"}'
        values: '0+100x40'
      - series: 'churn_unknown_category_total{field="PaymentMethod"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: UnknownCategorySpike
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Inputs contain categories never seen in training"
              description: "More than 5% of predictions carry an unseen category: possible data drift or a new upstream value."

  - name: a recent model change raises an info alert that then expires
    interval: 1m
    input_series:
      - series: 'churn_model_changes_total{kind="approve",pod="api-1"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: ModelChanged
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "The served model changed"
              description: "An approval, rollback or registry sync switched the model in the last 10 minutes (see the model dashboard)."
      - eval_time: 30m
        alertname: ModelChanged
        exp_alerts: []
