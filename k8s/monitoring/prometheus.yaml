apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: churn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: churn
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy:
    type: Recreate  # the volume can be mounted by one pod at a time
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.external-url=http://localhost:8088/prometheus
            - --web.route-prefix=/prometheus
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /prometheus/-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /prometheus/-/healthy, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: churn
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
