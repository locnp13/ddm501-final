apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: churn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: churn
  labels: {app: loki}
spec:
  replicas: 1
  strategy:
    type: Recreate  # the volume can be mounted by one pod at a time
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
---
# Not behind the Ingress: only Grafana (and Alloy, which writes) reach it, from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: churn
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
