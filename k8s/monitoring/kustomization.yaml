apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Without this the generated ConfigMaps would land in the default namespace, away from the pods.
namespace: churn
resources:
  - rbac.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml
  - loki.yaml
  - alloy.yaml
  - alert-hub.yaml
  - ingress.yaml
# Config changes get a new ConfigMap name, so the pods that use it roll automatically.
configMapGenerator:
  - name: prometheus-config
    files: [prometheus/prometheus.yml, prometheus/alerts.yml]
  - name: alertmanager-config
    files: [alertmanager/alertmanager.yml, alertmanager/alertmanager-telegram.yml]
  - name: loki-config
    files: [loki/loki.yaml]
  - name: alloy-config
    files: [alloy/config.alloy]
  - name: grafana-datasource
    files: [grafana/datasource.yaml]
  - name: grafana-dashboard-provider
    files: [grafana/dashboards.yaml]
  - name: grafana-dashboards
    files: [grafana/dashboards/api.json, grafana/dashboards/model.json, grafana/dashboards/versions.json, grafana/dashboards/logs.json]
