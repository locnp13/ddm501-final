apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: churn
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=http://localhost:8088/alertmanager
            - --web.route-prefix=/alertmanager
          ports:
            - {name: http, containerPort: 9093}
          readinessProbe:
            httpGet: {path: /alertmanager/-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /alertmanager/-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: data
          emptyDir: {}  # silences and notification state are lost on restart
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: churn
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: http}
